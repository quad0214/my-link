<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Checkerboard pattern -->
    <pattern id="checker" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#000000" fill-opacity="0.08" />
      <rect x="15" y="15" width="15" height="15" fill="#000000" fill-opacity="0.08" />
    </pattern>
    <!-- Diagonal Stripes -->
    <pattern id="stripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#000000" stroke-width="6" stroke-opacity="0.1" />
    </pattern>
    <!-- Dot Matrix -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="3" fill="#000000" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Base Color: Bold Pop Yellow -->
  <rect width="100%" height="100%" fill="#FFE600" />
  <!-- Pattern Overlay -->
  <rect width="100%" height="100%" fill="url(#dots)" />

  <!-- Retro Window / Neo Frame 1 (Cyan Block) -->
  <!-- Hard Shadow -->
  <rect x="70" y="50" width="460" height="250" rx="16" fill="#000000" />
  <!-- Main Box -->
  <rect x="62" y="42" width="460" height="250" rx="16" fill="#70D6FF" stroke="#000000" stroke-width="6" />
  <!-- Window Header Bar -->
  <rect x="62" y="42" width="460" height="46" rx="16" fill="#000000" />
  <rect x="62" y="70" width="460" height="18" fill="#000000" />
  <circle cx="88" cy="65" r="8" fill="#FF70A6" stroke="#000000" stroke-width="2" />
  <circle cx="110" cy="65" r="8" fill="#FFE600" stroke="#000000" stroke-width="2" />
  <circle cx="132" cy="65" r="8" fill="#4ADE80" stroke="#000000" stroke-width="2" />
  <text x="292" y="70" fill="#FFFFFF" font-family="monospace" font-weight="900" font-size="14" text-anchor="middle">terminal@jongcheon:~$</text>
  
  <!-- Terminal Content inside window -->
  <text x="88" y="125" fill="#000000" font-family="monospace" font-weight="900" font-size="20">&gt; npm run create-awesome-ui</text>
  <text x="88" y="165" fill="#000000" font-family="monospace" font-weight="700" font-size="16">✔ Ready in 0.042s (turbopack)</text>
  <text x="88" y="200" fill="#000000" font-family="monospace" font-weight="700" font-size="16">⚡ 100% Neobrutalism Aesthetics</text>
  <text x="88" y="235" fill="#000000" font-family="monospace" font-weight="700" font-size="16">✨ Clean Code &amp; Solid Architecture</text>
  <rect x="88" y="255" width="130" height="22" rx="4" fill="#000000" />
  <text x="153" y="270" fill="#FFE600" font-family="monospace" font-weight="900" font-size="11" text-anchor="middle">STATUS: ACTIVE</text>

  <!-- Neo Frame 2 (Pink Block Right) -->
  <g transform="rotate(-3 880 180)">
    <!-- Shadow -->
    <rect x="635" y="45" width="480" height="240" rx="16" fill="#000000" />
    <!-- Box -->
    <rect x="625" y="35" width="480" height="240" rx="16" fill="#FF70A6" stroke="#000000" stroke-width="6" />
    <rect x="625" y="35" width="480" height="240" rx="16" fill="url(#checker)" />
    
    <!-- Big Punchy Brutalist Typography -->
    <text x="660" y="105" fill="#000000" font-family="sans-serif" font-weight="900" font-size="44" letter-spacing="-1">HELLO WORLD!</text>
    <text x="660" y="155" fill="#FFFFFF" stroke="#000000" stroke-width="2" font-family="sans-serif" font-weight="900" font-size="34">FULL STACK DEV</text>
    
    <!-- Sticker Tags -->
    <g transform="translate(660, 185)">
      <!-- Sticker 1 -->
      <rect x="0" y="0" width="120" height="42" rx="8" fill="#FFE600" stroke="#000000" stroke-width="4" />
      <text x="60" y="26" fill="#000000" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">⚡ REACT 19</text>
      
      <!-- Sticker 2 -->
      <rect x="135" y="0" width="130" height="42" rx="8" fill="#4ADE80" stroke="#000000" stroke-width="4" />
      <text x="200" y="26" fill="#000000" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">🚀 NEXT.JS 16</text>
      
      <!-- Sticker 3 -->
      <rect x="280" y="0" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
      <text x="345" y="26" fill="#000000" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">🔥 TYPESCRIPT</text>
    </g>
  </g>

  <!-- Big Decorative Starburst Stamp -->
  <g transform="translate(565, 120)">
    <polygon points="40,0 52,24 78,19 64,42 80,61 54,67 51,93 29,77 8,88 13,62 0,45 24,35" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <text x="40" y="53" fill="#000000" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">★ TOP</text>
  </g>
</svg>
