<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#311042" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="100%" height="100%" fill="url(#bannerBg)" />

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient glowing orbs -->
  <circle cx="200" cy="120" r="220" fill="url(#glow1)" filter="blur(40px)" />
  <circle cx="950" cy="180" r="260" fill="url(#glow2)" filter="blur(50px)" />
  <circle cx="600" cy="80" r="180" fill="url(#glow3)" filter="blur(40px)" />

  <!-- Modern Geometric Flow Lines -->
  <path d="M-100 280 C200 180, 450 340, 750 200 C1000 80, 1150 180, 1300 140" fill="none" stroke="url(#glow1)" stroke-width="3" opacity="0.4" />
  <path d="M-100 310 C250 220, 500 370, 800 230 C1050 110, 1200 220, 1300 180" fill="none" stroke="url(#glow2)" stroke-width="2" opacity="0.3" />

  <!-- Subtle Floating Tech Elements -->
  <g opacity="0.35">
    <!-- Code snippet brackets -->
    <text x="1050" y="90" fill="#a855f7" font-family="monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>
    <text x="120" y="80" fill="#38bdf8" font-family="monospace" font-size="22">const developer = true;</text>
    <text x="780" y="60" fill="#60a5fa" font-family="monospace" font-size="18">{ create: 'impact' }</text>
    <circle cx="480" cy="160" r="3" fill="#f43f5e" />
    <circle cx="510" cy="130" r="2" fill="#38bdf8" />
    <circle cx="890" cy="120" r="4" fill="#a855f7" />
    <line x1="480" y1="160" x2="510" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
  </g>
</svg>
