<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#cmBg)" rx="16" />

  <!-- Dashboard Window Mockup -->
  <g filter="url(#mShadow)" transform="translate(40, 30)">
    <rect width="520" height="280" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="520" height="34" rx="14" fill="#1e293b" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="35" cy="17" r="4.5" fill="#eab308" />
    <circle cx="50" cy="17" r="4.5" fill="#22c55e" />
    <text x="75" y="21" fill="#94a3b8" font-size="11" font-family="monospace">cloudmetrics.internal/dashboard</text>
    <rect x="440" y="8" width="65" height="18" rx="9" fill="#10b981" fill-opacity="0.15" />
    <text x="452" y="20" fill="#34d399" font-size="9" font-weight="bold" font-family="sans-serif">● LIVE 99.9%</text>

    <!-- Top mini stats row -->
    <g transform="translate(20, 48)">
      <rect width="145" height="52" rx="8" fill="#1e293b" />
      <text x="12" y="20" fill="#94a3b8" font-size="9" font-family="sans-serif">RPS Throughput</text>
      <text x="12" y="42" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">14,280/s</text>
      <path d="M100 35 L115 25 L130 30" stroke="#38bdf8" stroke-width="2" fill="none" />

      <rect x="165" width="145" height="52" rx="8" fill="#1e293b" />
      <text x="177" y="20" fill="#94a3b8" font-size="9" font-family="sans-serif">Avg Latency</text>
      <text x="177" y="42" fill="#34d399" font-size="16" font-weight="bold" font-family="sans-serif">12.4 ms</text>

      <rect x="330" width="150" height="52" rx="8" fill="#1e293b" />
      <text x="342" y="20" fill="#94a3b8" font-size="9" font-family="sans-serif">Active Cluster Nodes</text>
      <text x="342" y="42" fill="#c084fc" font-size="16" font-weight="bold" font-family="sans-serif">24 / 24</text>
    </g>

    <!-- Main Chart Area -->
    <g transform="translate(20, 115)">
      <rect width="480" height="145" rx="10" fill="#141d2e" stroke="#1e293b" stroke-width="1" />
      <!-- Grid lines -->
      <line x1="20" y1="35" x2="460" y2="35" stroke="#334155" stroke-dasharray="4,4" opacity="0.4" />
      <line x1="20" y1="75" x2="460" y2="75" stroke="#334155" stroke-dasharray="4,4" opacity="0.4" />
      <line x1="20" y1="115" x2="460" y2="115" stroke="#334155" stroke-dasharray="4,4" opacity="0.4" />

      <!-- Area Chart -->
      <path d="M 25 115 Q 80 80, 140 90 T 260 45 T 380 65 T 455 30 L 455 130 L 25 130 Z" fill="url(#chartGrad)" />
      <path d="M 25 115 Q 80 80, 140 90 T 260 45 T 380 65 T 455 30" fill="none" stroke="#10b981" stroke-width="3" />

      <!-- Active Point Dot -->
      <circle cx="455" cy="30" r="5" fill="#10b981" />
      <circle cx="455" cy="30" r="9" fill="#10b981" opacity="0.4" />

      <!-- Secondary Chart Line -->
      <path d="M 25 125 Q 90 110, 160 112 T 280 85 T 390 95 T 455 75" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3" opacity="0.8" />
    </g>
  </g>
</svg>
