<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <!-- Canvas Background: Pastel Soft Orange / Peach -->
  <rect width="100%" height="100%" fill="#FED7AA" />

  <!-- Outer Border -->
  <rect x="0" y="0" width="600" height="340" fill="none" stroke="#000000" stroke-width="8" />

  <!-- Retro Window Container -->
  <!-- Shadow -->
  <rect x="58" y="38" width="490" height="265" rx="14" fill="#000000" />
  <!-- Body -->
  <rect x="50" y="30" width="490" height="265" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  
  <!-- Window Header with Hazard Diagonal Stripes -->
  <rect x="50" y="30" width="490" height="40" rx="14" fill="#000000" />
  <rect x="50" y="56" width="490" height="14" fill="#000000" />
  
  <rect x="65" y="42" width="16" height="16" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
  <rect x="87" y="42" width="16" height="16" fill="#FACC15" stroke="#FFFFFF" stroke-width="2" />
  <rect x="109" y="42" width="16" height="16" fill="#22C55E" stroke="#FFFFFF" stroke-width="2" />
  <text x="300" y="55" font-family="monospace" font-weight="900" font-size="13" fill="#FFE600" text-anchor="middle">METRICS_MONITOR_SYS.LOG</text>

  <!-- Top 3 Chunky Metric Badges -->
  <g transform="translate(70, 85)">
    <!-- Metric 1 -->
    <rect x="3" y="3" width="135" height="52" rx="6" fill="#000000" />
    <rect x="0" y="0" width="135" height="52" rx="6" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <text x="12" y="20" font-family="monospace" font-weight="900" font-size="10" fill="#000000">RPS TRAFFIC</text>
    <text x="12" y="42" font-family="sans-serif" font-weight="900" font-size="16" fill="#000000">14.2k/s</text>

    <!-- Metric 2 -->
    <rect x="158" y="3" width="135" height="52" rx="6" fill="#000000" />
    <rect x="155" y="0" width="135" height="52" rx="6" fill="#4ADE80" stroke="#000000" stroke-width="3" />
    <text x="167" y="20" font-family="monospace" font-weight="900" font-size="10" fill="#000000">LATENCY</text>
    <text x="167" y="42" font-family="sans-serif" font-weight="900" font-size="16" fill="#000000">12.4ms</text>

    <!-- Metric 3 -->
    <rect x="313" y="3" width="135" height="52" rx="6" fill="#000000" />
    <rect x="310" y="0" width="135" height="52" rx="6" fill="#70D6FF" stroke="#000000" stroke-width="3" />
    <text x="322" y="20" font-family="monospace" font-weight="900" font-size="10" fill="#000000">CLUSTER</text>
    <text x="322" y="42" font-family="sans-serif" font-weight="900" font-size="16" fill="#000000">24 / 24 OK</text>
  </g>

  <!-- Chunky Bar Chart Area -->
  <g transform="translate(70, 150)">
    <rect x="3" y="3" width="450" height="125" rx="8" fill="#000000" />
    <rect x="0" y="0" width="450" height="125" rx="8" fill="#F8FAFC" stroke="#000000" stroke-width="3" />
    
    <!-- Grid lines -->
    <line x1="20" y1="30" x2="430" y2="30" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="20" y1="65" x2="430" y2="65" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="20" y1="100" x2="430" y2="100" stroke="#000000" stroke-width="3" />

    <!-- Neobrutalist Chunky Bars -->
    <!-- Bar 1 -->
    <rect x="35" y="55" width="28" height="45" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <!-- Bar 2 -->
    <rect x="80" y="35" width="28" height="65" fill="#FF70A6" stroke="#000000" stroke-width="3" />
    <!-- Bar 3 -->
    <rect x="125" y="45" width="28" height="55" fill="#70D6FF" stroke="#000000" stroke-width="3" />
    <!-- Bar 4 -->
    <rect x="170" y="20" width="28" height="80" fill="#4ADE80" stroke="#000000" stroke-width="3" />
    <!-- Bar 5 -->
    <rect x="215" y="30" width="28" height="70" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <!-- Bar 6 -->
    <rect x="260" y="48" width="28" height="52" fill="#FF70A6" stroke="#000000" stroke-width="3" />
    <!-- Bar 7 -->
    <rect x="305" y="15" width="28" height="85" fill="#4ADE80" stroke="#000000" stroke-width="3" />
    <!-- Bar 8 -->
    <rect x="350" y="32" width="28" height="68" fill="#70D6FF" stroke="#000000" stroke-width="3" />
    <!-- Bar 9 -->
    <rect x="395" y="10" width="28" height="90" fill="#FFE600" stroke="#000000" stroke-width="3" />
  </g>
</svg>
