<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <linearGradient id="aiFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="docShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#aiBg)" rx="16" />
  <circle cx="300" cy="170" r="180" fill="url(#glowPurple)" filter="blur(40px)" />

  <!-- Flow Connection Lines -->
  <path d="M160 170 C220 170, 220 120, 280 120 C340 120, 340 170, 440 170" fill="none" stroke="url(#aiFlow)" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M160 170 C220 170, 220 220, 280 220 C340 220, 340 170, 440 170" fill="none" stroke="url(#aiFlow)" stroke-width="2" opacity="0.6" />

  <!-- Left Card: Input Document -->
  <g filter="url(#docShadow)" transform="translate(60, 90)">
    <rect width="130" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="18" y="20" width="40" height="8" rx="4" fill="#38bdf8" />
    <rect x="18" y="38" width="94" height="6" rx="3" fill="#64748b" />
    <rect x="18" y="52" width="80" height="6" rx="3" fill="#475569" />
    <rect x="18" y="66" width="88" height="6" rx="3" fill="#475569" />
    <rect x="18" y="80" width="70" height="6" rx="3" fill="#475569" />
    
    <rect x="18" y="104" width="94" height="36" rx="6" fill="#0f172a" />
    <text x="26" y="126" fill="#94a3b8" font-size="9" font-family="monospace">Raw PDF / Docs</text>
  </g>

  <!-- Center: AI Processing Engine Core -->
  <g filter="url(#docShadow)" transform="translate(250, 120)">
    <circle cx="50" cy="50" r="46" fill="#18181b" stroke="url(#aiFlow)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="32" fill="#27272a" />
    
    <!-- AI Sparkle Core -->
    <path d="M50 32 Q50 50 68 50 Q50 50 50 68 Q50 50 32 50 Q50 50 50 32 Z" fill="#c084fc" />
    <circle cx="50" cy="50" r="5" fill="#ffffff" />
    
    <!-- Orbiting nodes -->
    <circle cx="50" cy="14" r="4" fill="#38bdf8" />
    <circle cx="86" cy="50" r="4" fill="#ec4899" />
    <circle cx="50" cy="86" r="4" fill="#a855f7" />
    <circle cx="14" cy="50" r="4" fill="#34d399" />
  </g>

  <!-- Right Card: Output Insights / Summary -->
  <g filter="url(#docShadow)" transform="translate(410, 90)">
    <rect width="130" height="160" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="28" cy="26" r="8" fill="#10b981" opacity="0.2" />
    <circle cx="28" cy="26" r="3" fill="#10b981" />
    <text x="44" y="29" fill="#e2e8f0" font-size="10" font-weight="bold" font-family="sans-serif">Structured</text>
    
    <rect x="16" y="44" width="98" height="24" rx="6" fill="#0f172a" />
    <text x="24" y="59" fill="#38bdf8" font-size="9" font-family="sans-serif">✨ Executive Brief</text>

    <rect x="16" y="76" width="98" height="24" rx="6" fill="#0f172a" />
    <text x="24" y="91" fill="#c084fc" font-size="9" font-family="sans-serif">📊 Action Items</text>

    <rect x="16" y="108" width="98" height="34" rx="6" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3" />
    <text x="24" y="128" fill="#4ade80" font-size="10" font-weight="bold" font-family="sans-serif">98.5% Accuracy</text>
  </g>
</svg>
