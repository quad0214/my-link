<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="lsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#lsBg)" rx="16" />

  <!-- Ambient Glow -->
  <circle cx="150" cy="80" r="120" fill="#3b82f6" opacity="0.15" filter="blur(30px)" />
  <circle cx="450" cy="260" r="140" fill="#8b5cf6" opacity="0.2" filter="blur(30px)" />

  <!-- Mockup Phone Container -->
  <g filter="url(#pShadow)" transform="translate(180, 25)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="240" height="290" rx="28" fill="#18181b" stroke="#27272a" stroke-width="3" />
    <rect x="7" y="7" width="226" height="276" rx="22" fill="#09090b" />
    
    <!-- Phone Dynamic Island -->
    <rect x="85" y="14" width="70" height="12" rx="6" fill="#000000" />
    <circle cx="95" cy="20" r="3" fill="#22c55e" />

    <!-- Mini Profile Inside Mockup -->
    <circle cx="120" cy="62" r="22" fill="url(#cardGrad)" />
    <circle cx="120" cy="58" r="9" fill="#ffffff" opacity="0.9" />
    <path d="M107 76 C107 70, 113 67, 120 67 C127 67, 133 70, 133 76 Z" fill="#ffffff" opacity="0.9" />
    <rect x="85" y="92" width="70" height="6" rx="3" fill="#ffffff" opacity="0.8" />
    <rect x="95" y="102" width="50" height="4" rx="2" fill="#71717a" />

    <!-- Mini Link Cards -->
    <rect x="25" y="118" width="190" height="28" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <circle cx="42" cy="132" r="6" fill="#38bdf8" />
    <rect x="56" y="129" width="90" height="6" rx="3" fill="#e4e4e7" />
    <path d="M195 132 L200 132 M198 129 L201 132 L198 135" stroke="#71717a" stroke-width="1.5" fill="none" />

    <rect x="25" y="154" width="190" height="28" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <circle cx="42" cy="168" r="6" fill="#a855f7" />
    <rect x="56" y="165" width="80" height="6" rx="3" fill="#e4e4e7" />
    <path d="M195 168 L200 168 M198 165 L201 168 L198 171" stroke="#71717a" stroke-width="1.5" fill="none" />

    <rect x="25" y="190" width="190" height="28" rx="8" fill="url(#cardGrad)" opacity="0.9" />
    <circle cx="42" cy="204" r="6" fill="#ffffff" />
    <rect x="56" y="201" width="100" height="6" rx="3" fill="#ffffff" />

    <!-- Mini Analytics Bar inside phone -->
    <rect x="25" y="228" width="190" height="42" rx="8" fill="#18181b" />
    <text x="35" y="242" fill="#a1a1aa" font-size="8" font-family="sans-serif">Weekly Clicks</text>
    <text x="35" y="258" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif">+1,420</text>
    <path d="M110 258 Q130 248, 150 252 T180 238 T200 240" fill="none" stroke="#22c55e" stroke-width="2" />
  </g>

  <!-- Floating Stats Badge Left -->
  <g filter="url(#pShadow)" transform="translate(30, 80)">
    <rect width="120" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="26" r="10" fill="#10b981" opacity="0.2" />
    <circle cx="24" cy="26" r="4" fill="#10b981" />
    <text x="42" y="29" fill="#94a3b8" font-size="10" font-family="sans-serif">Live Views</text>
    <text x="24" y="50" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">28.4k</text>
    <text x="75" y="50" fill="#10b981" font-size="10" font-family="sans-serif">+24%</text>
  </g>

  <!-- Floating Feature Badge Right -->
  <g filter="url(#pShadow)" transform="translate(450, 160)">
    <rect width="120" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">⚡ Next-Gen</text>
    <text x="16" y="42" fill="#e2e8f0" font-size="12" font-family="sans-serif">SEO Optimized</text>
    <text x="16" y="58" fill="#94a3b8" font-size="10" font-family="sans-serif">Sub-50ms Load</text>
  </g>
</svg>
