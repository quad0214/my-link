<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <pattern id="lsDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.5" fill="#000000" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Canvas Background: Pastel Mint/Lime -->
  <rect width="100%" height="100%" fill="#A7F3D0" />
  <rect width="100%" height="100%" fill="url(#lsDots)" />

  <!-- Outer Border -->
  <rect x="0" y="0" width="600" height="340" fill="none" stroke="#000000" stroke-width="8" />

  <!-- Center Phone Frame (Neobrutalism Style) -->
  <!-- Shadow -->
  <rect x="195" y="25" width="220" height="295" rx="24" fill="#000000" />
  <!-- Body -->
  <rect x="185" y="15" width="220" height="295" rx="24" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
  
  <!-- Phone Notch / Camera Bar -->
  <rect x="250" y="24" width="90" height="12" rx="6" fill="#000000" />
  <circle cx="320" cy="30" r="3" fill="#4ADE80" />

  <!-- Avatar inside Phone -->
  <!-- Shadow -->
  <circle cx="298" cy="73" r="24" fill="#000000" />
  <!-- Main -->
  <circle cx="295" cy="70" r="24" fill="#FFE600" stroke="#000000" stroke-width="4" />
  <text x="295" y="77" font-family="sans-serif" font-weight="900" font-size="18" fill="#000000" text-anchor="middle">⚡</text>

  <!-- Title & Handle -->
  <rect x="240" y="104" width="110" height="10" rx="3" fill="#000000" />
  <text x="295" y="126" font-family="monospace" font-weight="700" font-size="10" fill="#000000" text-anchor="middle">@jongcheon.link</text>

  <!-- Chunky Link 1 (Yellow) -->
  <g transform="translate(205, 140)">
    <rect x="4" y="4" width="180" height="34" rx="8" fill="#000000" />
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#FFE600" stroke="#000000" stroke-width="3" />
    <text x="20" y="22" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">🔥 My GitHub</text>
    <text x="160" y="22" font-family="sans-serif" font-weight="900" font-size="12" fill="#000000">→</text>
  </g>

  <!-- Chunky Link 2 (Pink) -->
  <g transform="translate(205, 185)">
    <rect x="4" y="4" width="180" height="34" rx="8" fill="#000000" />
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#FF70A6" stroke="#000000" stroke-width="3" />
    <text x="20" y="22" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">✍️ Tech Blog</text>
    <text x="160" y="22" font-family="sans-serif" font-weight="900" font-size="12" fill="#000000">→</text>
  </g>

  <!-- Chunky Link 3 (Cyan) -->
  <g transform="translate(205, 230)">
    <rect x="4" y="4" width="180" height="34" rx="8" fill="#000000" />
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#70D6FF" stroke="#000000" stroke-width="3" />
    <text x="20" y="22" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">💼 Portfolio V2</text>
    <text x="160" y="22" font-family="sans-serif" font-weight="900" font-size="12" fill="#000000">→</text>
  </g>

  <!-- Left Floating Sticker: "100% RESPONSIVE" -->
  <g transform="rotate(-6 80 120)">
    <rect x="34" y="84" width="120" height="60" rx="10" fill="#000000" />
    <rect x="30" y="80" width="120" height="60" rx="10" fill="#FFE600" stroke="#000000" stroke-width="4" />
    <text x="90" y="105" font-family="sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">★ MOBILE</text>
    <text x="90" y="125" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle">OPTIMIZED</text>
  </g>

  <!-- Right Floating Sticker: "FAST STATS" -->
  <g transform="rotate(8 500 190)">
    <rect x="444" y="144" width="120" height="64" rx="10" fill="#000000" />
    <rect x="440" y="140" width="120" height="64" rx="10" fill="#FF70A6" stroke="#000000" stroke-width="4" />
    <text x="500" y="166" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="middle">⚡ SPEED</text>
    <text x="500" y="188" font-family="monospace" font-weight="900" font-size="15" fill="#000000" text-anchor="middle">0.05 SEC</text>
  </g>
</svg>
