<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe0bd" />
      <stop offset="100%" stop-color="#ffd1a4" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGrad)" />
  
  <!-- Subtle Ambient Glow Rings -->
  <circle cx="160" cy="160" r="142" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2" />
  <circle cx="80" cy="80" r="40" fill="#ffffff" opacity="0.08" />
  <circle cx="250" cy="240" r="60" fill="#38bdf8" opacity="0.15" />

  <!-- Clothes / Hoodie -->
  <g filter="url(#shadow)">
    <path d="M70 295 C70 240, 110 220, 160 220 C210 220, 250 240, 250 295 C250 305, 230 310, 160 310 C90 310, 70 305, 70 295 Z" fill="url(#clothGrad)" />
    <!-- Hoodie Inner Collar / Shirt -->
    <path d="M130 225 L160 260 L190 225 Z" fill="#334155" />
    <path d="M140 225 L160 250 L180 225 Z" fill="#ffffff" />
    <!-- Tech Accent Stripe -->
    <circle cx="160" cy="275" r="4" fill="#38bdf8" />
  </g>

  <!-- Neck -->
  <rect x="145" y="180" width="30" height="42" rx="6" fill="#f5c296" />

  <!-- Head Base -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <ellipse cx="108" cy="155" rx="9" ry="14" fill="#ffd1a4" />
    <ellipse cx="212" cy="155" rx="9" ry="14" fill="#ffd1a4" />
    <ellipse cx="109" cy="155" rx="5" ry="8" fill="#f5b882" />
    <ellipse cx="211" cy="155" rx="5" ry="8" fill="#f5b882" />

    <!-- Face Shape -->
    <path d="M115 135 C115 90, 205 90, 205 135 C205 175, 195 205, 160 205 C125 205, 115 175, 115 135 Z" fill="url(#skinGrad)" />

    <!-- Hair Back/Base -->
    <path d="M112 130 C110 85, 130 65, 160 65 C190 65, 210 85, 208 130 C208 110, 200 80, 160 80 C120 80, 112 110, 112 130 Z" fill="url(#hairGrad)" />
    <!-- Hair Top Modern Styled Volume -->
    <path d="M106 120 C104 80, 130 55, 162 55 C195 55, 216 75, 214 115 C206 100, 190 85, 160 85 C130 85, 115 102, 106 120 Z" fill="url(#hairGrad)" />
    <path d="M116 95 C135 68, 175 66, 200 88 C185 80, 155 78, 132 94 C124 100, 118 108, 116 95 Z" fill="#374151" />

    <!-- Modern Glasses -->
    <rect x="122" y="132" width="30" height="22" rx="6" fill="none" stroke="#1e293b" stroke-width="3" />
    <rect x="168" y="132" width="30" height="22" rx="6" fill="none" stroke="#1e293b" stroke-width="3" />
    <line x1="152" y1="142" x2="168" y2="142" stroke="#1e293b" stroke-width="3" />
    <line x1="112" y1="140" x2="122" y2="142" stroke="#1e293b" stroke-width="3" />
    <line x1="198" y1="142" x2="208" y2="140" stroke="#1e293b" stroke-width="3" />
    <!-- Glass Lens Reflections -->
    <path d="M126 136 L138 136 L130 150 L126 150 Z" fill="#ffffff" opacity="0.35" />
    <path d="M172 136 L184 136 L176 150 L172 150 Z" fill="#ffffff" opacity="0.35" />

    <!-- Eyes (Behind Glasses) -->
    <circle cx="137" cy="143" r="3.5" fill="#1e293b" />
    <circle cx="138.5" cy="141.5" r="1.2" fill="#ffffff" />
    <circle cx="183" cy="143" r="3.5" fill="#1e293b" />
    <circle cx="184.5" cy="141.5" r="1.2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M125 125 C132 122, 142 123, 148 126" stroke="#111827" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M172 126 C178 123, 188 122, 195 125" stroke="#111827" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M158 152 Q160 162 163 162" stroke="#d99b6e" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Friendly Smile -->
    <path d="M148 174 Q160 183 172 174" stroke="#c26359" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cheek Blush -->
    <ellipse cx="126" cy="165" rx="7" ry="4" fill="#f87171" opacity="0.25" />
    <ellipse cx="194" cy="165" rx="7" ry="4" fill="#f87171" opacity="0.25" />
  </g>

  <!-- Modern Tech Sparkle Accent -->
  <path d="M245 80 Q255 80 255 70 Q255 80 265 80 Q255 80 255 90 Q255 80 245 80 Z" fill="#fde047" opacity="0.9" />
  <circle cx="270" cy="100" r="3" fill="#67e8f9" />
  <path d="M60 180 Q66 180 66 174 Q66 180 72 180 Q66 180 66 186 Q66 180 60 180 Z" fill="#93c5fd" opacity="0.8" />
</svg>
