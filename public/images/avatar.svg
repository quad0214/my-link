<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <!-- Background with Hard Offset Shadow -->
  <!-- Shadow -->
  <rect x="20" y="20" width="280" height="280" rx="36" fill="#000000" />
  <!-- Main Box -->
  <rect x="12" y="12" width="280" height="280" rx="36" fill="#FFE600" stroke="#000000" stroke-width="6" />

  <!-- Background Half-Tone / Pattern Dots -->
  <g fill="#000000" opacity="0.12">
    <circle cx="45" cy="45" r="4" /><circle cx="75" cy="45" r="4" /><circle cx="105" cy="45" r="4" />
    <circle cx="45" cy="75" r="4" /><circle cx="75" cy="75" r="4" /><circle cx="105" cy="75" r="4" />
    <circle cx="215" cy="45" r="4" /><circle cx="245" cy="45" r="4" />
    <circle cx="215" cy="75" r="4" /><circle cx="245" cy="75" r="4" />
    <circle cx="45" cy="225" r="4" /><circle cx="75" cy="225" r="4" />
  </g>

  <!-- Starburst Badge in corner -->
  <g transform="translate(230, 25)">
    <polygon points="25,0 32,15 48,12 40,26 50,38 34,42 32,58 18,48 5,55 8,39 0,28 15,22" fill="#FF70A6" stroke="#000000" stroke-width="3" />
    <text x="25" y="33" fill="#000000" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">PRO</text>
  </g>

  <!-- Clothes / Hoodie -->
  <g>
    <!-- Hoodie Shadow -->
    <path d="M55 285 C55 215, 100 195, 152 195 C204 195, 249 215, 249 285 Z" fill="#000000" />
    <!-- Hoodie Body -->
    <path d="M50 280 C50 210, 95 190, 152 190 C209 190, 254 210, 254 280 Z" fill="#70D6FF" stroke="#000000" stroke-width="6" />
    <!-- Collar & Zip -->
    <path d="M127 195 L152 235 L177 195 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4" />
    <line x1="152" y1="235" x2="152" y2="280" stroke="#000000" stroke-width="5" />
    <!-- Hoodie Pocket / Badge -->
    <rect x="75" y="245" width="35" height="22" rx="6" fill="#FF70A6" stroke="#000000" stroke-width="3" />
    <text x="92" y="260" font-family="monospace" font-weight="900" font-size="10" fill="#000000" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Neck -->
  <rect x="136" y="155" width="32" height="42" rx="4" fill="#FFD1A4" stroke="#000000" stroke-width="5" />

  <!-- Head Base -->
  <g>
    <!-- Ears -->
    <ellipse cx="98" cy="140" rx="10" ry="15" fill="#FFD1A4" stroke="#000000" stroke-width="5" />
    <ellipse cx="206" cy="140" rx="10" ry="15" fill="#FFD1A4" stroke="#000000" stroke-width="5" />
    
    <!-- Face -->
    <path d="M106 125 C106 75, 198 75, 198 125 C198 170, 185 180, 152 180 C119 180, 106 170, 106 125 Z" fill="#FFD1A4" stroke="#000000" stroke-width="6" />

    <!-- Hair (Neobrutalist Chunky Geometry) -->
    <!-- Hair back -->
    <path d="M96 115 C92 65, 120 40, 152 40 C188 40, 212 65, 208 115 C208 90, 195 62, 152 62 C115 62, 98 90, 96 115 Z" fill="#000000" />
    <!-- Hair front fringe / spikes -->
    <polygon points="102,90 120,60 135,85 155,55 170,82 190,62 204,95 190,82 170,72 152,70 130,75 112,85" fill="#000000" />

    <!-- Chunky Retro Black Sunglasses (Pure Neobrutalism!) -->
    <!-- Left Lens -->
    <rect x="110" y="115" width="36" height="26" rx="4" fill="#000000" stroke="#000000" stroke-width="2" />
    <rect x="114" y="119" width="12" height="6" fill="#FFFFFF" />
    <!-- Right Lens -->
    <rect x="158" y="115" width="36" height="26" rx="4" fill="#000000" stroke="#000000" stroke-width="2" />
    <rect x="162" y="119" width="12" height="6" fill="#FFFFFF" />
    <!-- Bridge -->
    <rect x="144" y="122" width="16" height="6" fill="#000000" />
    <!-- Frame Sides -->
    <line x1="98" y1="124" x2="110" y2="124" stroke="#000000" stroke-width="5" />
    <line x1="194" y1="124" x2="206" y2="124" stroke="#000000" stroke-width="5" />

    <!-- Nose -->
    <path d="M150 148 L156 148 L152 155 Z" fill="#000000" />

    <!-- Big Confident Grin -->
    <path d="M136 160 Q152 173 168 160 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

    <!-- Pop Cheeks -->
    <circle cx="118" cy="154" r="6" fill="#FF70A6" stroke="#000000" stroke-width="2" />
    <circle cx="186" cy="154" r="6" fill="#FF70A6" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Floating Stickers -->
  <!-- Sparkle 1 -->
  <path d="M35 150 Q45 150 45 140 Q45 150 55 150 Q45 150 45 160 Q45 150 35 150 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
  <!-- Sparkle 2 -->
  <path d="M260 170 Q270 170 270 160 Q270 170 280 170 Q270 170 270 180 Q270 170 260 170 Z" fill="#38BDF8" stroke="#000000" stroke-width="3" />
</svg>
